const YAZILAR = [
{
  no: 1,
  slug: "yercekimiyle-kavga-eden-adam",
  kisi: "Roger Babson",
  cevap: "Fiyatın bir merkezi vardır.",
  baslik: "Yerçekimiyle Kavga Eden Adam ve Bir Dirgenin Hikâyesi",
  spot: "Bugün her grafik platformunda üç tıkla çizilen Andrews Dirgeni'nin arkasında yarım asırlık bir zincir var. Zincir bir nehirde boğulan on üç yaşında bir kızla başlıyor. Sonra 1929 çöküşünü \"bilen\" bir istatistikçiden ve yöntemini mezarına götüren bir matematikçiden geçiyor. Hikâye çekici; kanıtlar ise daha mütevazı.",
  hazir: true,
  govde: `26 Ağustos 1893'te, Massachusetts'in balıkçı kasabası Gloucester'da, on üç yaşındaki Edith Low Babson nehirde yüzerken boğuldu. Ağabeyi Roger Ward Babson on sekiz yaşındaydı. Otobiyografisinde anlattığına göre Edith, onu son gördüğünde Chicago'daki Dünya Fuarı'na gitmek üzere olan ağabeyine bütün birikimini, iki doları vermişti.

Babson bu ölümü elli beş yıl sonra, 1948'de, olağandışı bir cümleyle anlatacaktı. Herkes kız kardeşinin boğulduğunu söylüyordu. Oysa ona göre iyi bir yüzücü olan Edith yerçekimine karşı koyamamıştı; yerçekimi bir ejderha gibi gelip onu yakalamış ve dibe çekmişti. Denemenin başlığı tezini özetliyordu: "Yerçekimi: 1 Numaralı Düşmanımız." Bu metinde Babson olayı çocukken yaşadığını ve kaybettiğinin en büyük ablası olduğunu yazar. Oysa aile kayıtları Edith'in ondan beş yaş küçük olduğunu gösteriyor. Yarım asırlık bir yasın hafızayı nasıl biçimlendirdiğine dair küçük ama anlamlı bir iz.

Bu cümleleri yazan kişi bir meczup değildi. MIT'den mühendislik diplomalı bir istatistikçiydi ve servetini piyasaları okuyarak kurmuştu. Babson College'ın kurucusuydu. 1940'ta Yasakçı Parti'nin başkan adayı oldu. Amerikan kamuoyunda ise en çok 1929 çöküşünü önceden haber veren adam olarak tanındı. Bugün kripto para grafiklerinde yaygın biçimde kullanılan bir teknik analiz aracının soy ağacı da, dolambaçlı bir yoldan, onun Newton hayranlığına bağlanıyor.

## Newton'dan borsaya

Babson'ın Newton ilgisi iki kolda ilerledi. Birincisi yerçekiminin kendisiydi; ona ileride döneceğiz. İkincisi hareketin üçüncü yasasıydı: Her etkiye eşit ve zıt bir tepki karşılık gelir. Babson bu ilkeyi fizikten çıkarıp ekonomiye taşıdı. Refah dönemlerinin ardından, büyüklükleri orantılı depresyonlar gelmeliydi.

Fikrin kökeni tek bir dehaya dayanmıyor. 1907 paniği sırasında Babson New York'ta tahvil araştırmaları satıyordu. Deneyimli profesyonellerin uğradığı kayıplar onu sarstı. Bunun üzerine MIT'deki eski hocası, mühendislik profesörü George F. Swain ile çalışmaya başladı. Babson College'ın kendi tarihçesi de Babsonchart'ın bu işbirliğinden doğduğunu yazıyor. Aktarıldığına göre, Babson'ın pik demir, mısır ve domuz fiyatlarından oluşturduğu zikzaklı bileşik endeksin ortasından bir "normal çizgi" geçiren Swain'di. Grafiğin varsayımı basitti: Ekonominin bu çizginin üstünde kaldığı alan, er ya da geç altında kalacağı bir alanla dengelenmeliydi.

Babson 1904'te, Wellesley Hills'teki evinden yönettiği Babson İstatistik Kurumu'nu kurmuştu. Tahvil ve hisse analizlerini bankalara ve yatırımcılara bülten olarak satıyordu. Babsonchart bu bültenlerin vitrin ürünü oldu. Bugünkü ölçütlerle kaba bir yöntemdi. Yine de "tek bakışta" okunabilen ilk ekonomik göstergelerden biri sayılıyor.

## "Er ya da geç bir çöküş geliyor"

5 Eylül 1929'da Babson, Wellesley'deki Babson Enstitüsü kampüsünde düzenlenen 16. Ulusal İş Konferansı'nda kürsüye çıktı. Söylediği cümle bir gün içinde efsaneleşti: Er ya da geç bir çöküş geliyordu ve bu çöküş müthiş olabilirdi. Sözler öğleden sonra Dow Jones haber bandına düştü. Günün son saatinde AT&T, Westinghouse ve U.S. Steel sert değer kaybettiler. Dow Jones Sanayi Endeksi o gün yüzde 2,6 civarında geriledi. Basın bu düşüşe "Babson Kırılması" adını verdi.

Hikâyenin genellikle anlatılmayan yanı şu: Babson aynı uyarıyı en az iki yıldır yapıyordu. O günkü konuşmasında da geçen yıl ve ondan önceki yıl söylediklerini tekrarladığını vurguladı. Yıllarca kıyamet haberi veren biri sonunda haklı çıktığında, bunun bir yöntemin zaferi mi yoksa istatistiksel bir kaçınılmazlık mı olduğunu ayırmak kolay değil.

Piyasa da o eylülde ona pek inanmadı. Pek çok yatırımcı düşüşü "sağlıklı bir düzeltme" ve alım fırsatı olarak gördü. Chicago Tribune ekonomistlerin ve Wall Street yöneticilerinin itirazlarını yayımladı; Babson'ın vatanseverliği bile sorgulandı. Döneminin en ünlü iktisatçısı Irving Fisher, Babson'a yanıt niteliğindeki konuşmasında 15 Ekim'de hisse fiyatlarının kalıcı bir yüksek düzlüğe ulaşmış göründüğünü söyledi. On üç gün sonra, 28 Ekim 1929 Kara Pazartesi'sinde Dow tek günde yaklaşık yüzde 13 değer kaybetti. Büyük Buhran ardından gelen yıllar boyunca yayılarak derinleşti.

## Beyaz Saray'dan gelen soru ve kayıp formül

Hikâyenin en çok tekrarlanan ve en az belgelenen kısmı burada başlıyor. Anlatıya göre 1933'te göreve gelen Franklin D. Roosevelt, Amerikan borsalarının önümüzdeki yıllardaki seyri için Babson'dan bir tahmin istedi. Babson da işi, o dönemde neredeyse tanınmayan matematikçi George Marechal'e havale etti.

Marechal Aralık 1933'te 1933-1948 dönemini kapsayan on beş yıllık bir Dow Jones projeksiyonu hazırladı. Tahminine o kadar güveniyordu ki grafiğin telif hakkını önceden aldı. Grafiğin sonraki versiyonlarında üstte Marechal'in öngörüsü, altta endeksin gerçekleşen seyri yer alıyor ve iki eğri çarpıcı biçimde örtüşüyor. Bu on beş yılın içinde bir dünya savaşının bulunduğunu hatırlamak, örtüşmeyi daha da şaşırtıcı kılıyor.

Marechal'in yöntemi bilinmiyor; formülü onunla birlikte öldü. Geriye kalan izler, onun da Babson'ın normal çizgisinin bir türevini kullandığını düşündürüyor. Arkadaşı Alan Andrews grafiğin dönüş noktalarını işaretlemişti. Bu işaretler, bugün "medyan çizgi" denen yapının Marechal'in çalışmalarında zaten var olduğuna işaret ediyor.

Burada gazetecilik açısından bir çekince koymak gerekiyor. Roosevelt talebi de, Marechal'in isabeti de büyük ölçüde Andrews ve onun çevresinin aktarımlarıyla bugüne ulaştı. Bazı kaynaklar bu bölümü açıkça "efsane" diye anıyor. Tahminin sonradan revize edilip edilmediği ya da başka tahminler unutulurken yalnızca tutanın mı hatırlandığı, bağımsız bir kaynakla yanıtlanmış sorular değil.

## Mühendis, milyon dolar ve dirgen

Zincirin üçüncü halkası Dr. Alan Hall Andrews. Doğum tarihi bilinmiyor; 1985'te öldü. Babası bir aracı kurum sahibiydi. Andrews MIT'de mühendislik, ardından Harvard'da eğitim gördü. Aktarılan bir hikâyeye göre babası ondan bir yılda bir milyon dolar kazanmasını istedi. Andrews bu hedefi bir yılda tutturamadı, ama iki yılda emtia ticaretinden bir milyon dolar kazandı. Daha sonra Miami Üniversitesi'nde inşaat mühendisliği dersleri verdi.

Andrews, Babson'ın seminerlerinden birinde onunla tanıştı ve etki-tepki tekniklerini doğrudan ondan öğrendi. Emekliliğinde bu birikimi bir eğitim programına dönüştürdü. Hocasına saygısından kursunu "Etki-Tepki Kursu" diye adlandırdı. 1960'lar ve 70'lerde bu kursu 1.500 dolara sattı. Seminerlerine New York ve Chicago borsalarının pit tüccarları katıldı. Anlatıldığına göre aracın bugünkü adını Andrews'un kendisi değil, tahıl piyasasında işlem yapan öğrencileri koydu: "Andrews'un Dirgeni."

Dirgenin kuruluşu basit. Grafikte art arda üç salınım noktası seçilir. Yükselen bir trendde bunlar bir dip (P0), ardından gelen tepe (P1) ve daha yüksek bir dip (P2) olur. P0'dan, P1 ile P2'nin tam orta noktasına doğru bir çizgi uzatılır; bu medyan çizgidir. P1 ve P2'den bu çizgiye paralel iki çizgi daha çekilir ve ortaya üç dişli bir kanal çıkar. Yöntemin temel varsayımı Babson'dan miras: Fiyat zamanın büyük kısmında medyan çizgiye doğru çekilir, kanalın kenarlarına ulaştığında ise tepki verme eğilimi taşır. Bu bir kural değil, bir eğilim iddiasıdır. Andrews'un kendi öğretisinde bile fiyatın medyan çizgiye hiç ulaşamadan dönmesi ayrı bir uyarı işareti sayılır.

      <span class="rt">${y.hazir ? (isRead(y) ? `<span class="done">Okundu</span>, ${minutes(y)} dakikalık okuma` : `${minutes(y)} dakikalık okuma`) : "Hazırlanıyor"}</span>`;
    return y.hazir
      ? `<a class="col" href="#/yazi/${y.slug}" data-n="${y.no}">${inner}</a>`
      : `<div class="col soon" data-n="${y.no}">${inner}</div>`;
  }).join("");
  $("#main").innerHTML = `
    <section class="hero">
      <h1>Fiyat nedir, nereye gider, izini nasıl süreriz?</h1>
      <p>Bu bir yazı dizisi. Her yazı, bu soruya cevap vermeye çalışmış bir insanın hikâyesi: aynı zikzaklı çizgiye bakıp her biri başka bir şey görmüş tüccarlar, istatistikçiler, matematikçiler. Yazılar kendi başına da okunur, ama sırayla okunmak üzere yazıldı.</p>
    </section>
    <figure class="tape" style="margin-left:0;margin-right:0">
      <div class="${firstHome ? "draw" : ""}" id="tapebox">${tapeSVG({guides:true})}</div>
      <div class="nums" aria-hidden="true"><span style="left:0">1</span><span style="left:33.33%">2</span><span style="left:66.66%">3</span></div>
    </figure>
    <nav class="cols" aria-label="Dizinin yazıları">${cols}</nav>
    <p class="caption">Yukarıdaki çizgi dizinin kendisi. Her bölümü, o yazının fiyata verdiği cevaba göre çizildi: önce bir merkezin etrafında salınıyor, sonra sarhoş gibi yürüyor, sonra kopup sıçrıyor.</p>`;
  firstHome = false;
  const svg = $("#tapebox svg");
  document.querySelectorAll(".col").forEach(c=>{
    const on = ()=>svg.setAttribute("data-hl", c.dataset.n), off = ()=>svg.removeAttribute("data-hl");
    c.addEventListener("mouseenter", on); c.addEventListener("mouseleave", off);
    c.addEventListener("focus", on); c.addEventListener("blur", off);
  });
}

function article(y){
  document.title = y.baslik + " | Finansal Bilgiler Okulası";
  const next = YAZILAR.find(z=>z.no===y.no+1);
  const hits = YAZILAR.slice(0,3).map(z=> z.hazir && z.no!==y.no
    ? `<a href="#/yazi/${z.slug}" aria-label="${z.no}. yazı: ${esc(z.baslik)}"></a>` : `<span></span>`).join("");
  let end;
  if (next && next.hazir){
    end = `<p class="lbl">Dizide sıradaki, ${sira(next.no)} yazı</p>
      <a class="go" href="#/yazi/${next.slug}"><span class="t">${esc(next.baslik)}</span><span class="a">${esc(next.kisi)}: ${esc(next.cevap)}</span></a>`;
  } else if (next){
    end = `<p class="lbl">Dizide sıradaki, ${sira(next.no)} yazı</p>
      <p class="soon"><em>${esc(next.kisi)}</em> hazırlanıyor. ${esc(next.spot)}</p>`;
  } else {
    end = `<p class="lbl">Dizinin şimdilik son yazısı</p>`;
  }
  $("#main").innerHTML = `
    <article class="read">
      <div class="mini">
        ${tapeSVG({hl:y.no, guides:y.no===1})}
        <div class="hit">${hits}</div>
      </div>
      <div class="mini-l"><a href="#/">Dizinin başı</a><span>${y.no} / ${YAZILAR.length}</span></div>
      <header class="rhead">
        <p class="which">Dizinin ${sira(y.no)} yazısı, <em>${esc(y.kisi)}</em></p>
        <h1 tabindex="-1">${esc(y.baslik)}</h1>
        <p class="deck">${inline(y.spot)}</p>
        <p class="meta">${minutes(y)} dakikalık okuma</p>
      </header>
      <div class="body">${render(y.govde)}</div>
      <footer class="next">${end}<br><a class="back" href="#/">Dizinin başına dön</a></footer>
    </article>`;
  window.scrollTo(0,0);
  const h = $(".rhead h1"); if (h) h.focus({preventScroll:true});
}

function route(){
  const m = location.hash.match(/^#\/yazi\/([\w-]+)/);
  const y = m && YAZILAR.find(z=>z.slug===m[1] && z.hazir);
  current = y || null;
  if (y) article(y); else { home(); window.scrollTo(0,0); }
  progress();
}

let current = null;
function progress(){
  const bar = $("#bar");
  if (!current){ bar.style.transform = "scaleX(0)"; return; }
  const body = $(".body"); if (!body) return;
  const top = body.getBoundingClientRect().top + scrollY - innerHeight*.3;
  const end = body.getBoundingClientRect().bottom + scrollY - innerHeight;
  const p = Math.max(0, Math.min(1, (scrollY - top) / Math.max(1, end - top)));
  bar.style.transform = `scaleX(${p})`;
  if (p > .92) store.set("fbo-okundu-"+current.slug, "1");
}
addEventListener("scroll", progress, {passive:true});
addEventListener("resize", progress);
addEventListener("hashchange", route);

/* gece/gündüz */
(function(){
  const root = document.documentElement, btn = $("#theme");
  const saved = store.get("fbo-tema"); if (saved) root.dataset.theme = saved;
  const dark = ()=> root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const label = ()=>{ btn.textContent = dark() ? "Gündüz" : "Gece"; };
  btn.addEventListener("click", ()=>{ root.dataset.theme = dark() ? "light" : "dark"; store.set("fbo-tema", root.dataset.theme); label(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", label);
  label();
})();

route();
</script>
</body>
</html>
