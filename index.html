<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finansal Bilgiler Okulası</title>

<meta property="og:description" content="Fiyat nedir, nereye gider, izini nasıl süreriz? Bu soruya cevap aramış insanların hikâyeleri.">

<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#EDEFEA; --ink:#1B2433; --muted:#5E6878; --rule:#C6D0D9; --red:#B42318; --soft:#E2E6E0;
  --serif:"Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121820; --ink:#E3E5DF; --muted:#98A1AD; --rule:#2A3441; --red:#EE7462; --soft:#19212B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121820; --ink:#E3E5DF; --muted:#98A1AD; --rule:#2A3441; --red:#EE7462; --soft:#19212B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5;
  font-optical-sizing:auto;font-variant-numeric:oldstyle-nums proportional-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
img,svg{max-width:100%}

.wrap{max-width:1100px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}

/* başlık */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:26px 0 0}
.mark{font-size:1.2rem;font-weight:600;text-decoration:none;letter-spacing:-.005em;font-variation-settings:"opsz" 24}
.mark b{font-weight:600;color:var(--red)}
.top-r{display:flex;align-items:baseline;gap:18px;font-size:.95rem;color:var(--muted)}
.top-r a{text-decoration:none}
.top-r a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.theme{font:inherit;color:inherit;background:none;border:0;padding:6px 2px;cursor:pointer}
.theme:hover{color:var(--ink)}

/* ana sayfa */
.hero{padding:clamp(56px,10vw,120px) 0 clamp(28px,4vw,44px)}
.hero h1{margin:0;font-weight:500;font-size:clamp(2.4rem,6.4vw,4.9rem);line-height:1.02;letter-spacing:-.022em;max-width:15ch;
  font-variation-settings:"opsz" 72;text-wrap:balance}
.hero p{margin:28px 0 0;font-size:clamp(1.1rem,1.6vw,1.28rem);line-height:1.55;color:var(--muted);max-width:56ch;text-wrap:pretty}

.tape{position:relative;margin:clamp(18px,3vw,30px) 0 0}
.tape svg{display:block;width:100%;height:clamp(170px,24vw,270px);overflow:visible}
.tape .nums{position:absolute;inset:0;pointer-events:none}
.tape .nums span{position:absolute;top:-2px;font-style:italic;font-size:1.05rem;color:var(--muted);transform:translateX(8px)}
.draw{animation:reveal 2.4s cubic-bezier(.45,.05,.2,1) .15s both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

svg .p{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke .25s,opacity .25s}
svg .p.soon{stroke:var(--muted);stroke-dasharray:3 5;opacity:.8}
svg .g{stroke:var(--rule);stroke-width:1;fill:none;vector-effect:non-scaling-stroke;transition:opacity .25s}
svg .g.fork{stroke-dasharray:2 4}
svg .g.med{stroke:var(--muted);opacity:.55}
svg .div{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
svg.hl .p:not(.on){opacity:.28}
svg.hl .p.on{stroke:var(--red);opacity:1}
svg.hl .g{opacity:.35}

.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);border-top:1px solid var(--ink);margin-top:0}
.col{display:block;text-decoration:none;padding:18px 22px 26px 0;position:relative}
.col + .col{padding-left:22px;border-left:1px solid var(--rule)}
.col .n{display:block;font-size:2.6rem;line-height:1;font-weight:400;font-style:italic;color:var(--red);font-variation-settings:"opsz" 72}
.col .who{display:block;margin-top:14px;font-size:.98rem;color:var(--muted)}
.col .ans{display:block;margin-top:4px;font-size:1.42rem;line-height:1.18;font-weight:500;letter-spacing:-.01em;font-variation-settings:"opsz" 36;text-wrap:balance}
.col .ttl{display:block;margin-top:12px;font-size:1.02rem;font-style:italic;line-height:1.35;color:var(--ink)}
.col .rt{display:block;margin-top:14px;font-size:.92rem;color:var(--muted)}
a.col:hover .ans, a.col:focus-visible .ans{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.col.soon .n,.col.soon .ans,.col.soon .ttl{color:var(--muted)}
.col .rt .done{color:var(--red)}
.cols.list{grid-template-columns:1fr}
.cols.list .col{display:grid;grid-template-columns:3.2rem minmax(0,1fr) minmax(0,1.3fr) auto;gap:4px 22px;align-items:baseline;padding:18px 0;border-left:0}
.cols.list .col + .col{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
.cols.list .col .n{font-size:1.9rem;grid-row:span 2}
.cols.list .col .who{margin:0;grid-column:2}
.cols.list .col .ans{margin:0;grid-column:2;font-size:1.25rem}
.cols.list .col .ttl{margin:0;grid-column:3;grid-row:1 / span 2}
.cols.list .col .rt{margin:0;grid-column:4;grid-row:1 / span 2;white-space:nowrap}
@media (max-width:760px){.cols.list .col{grid-template-columns:2.6rem 1fr}.cols.list .col .ttl,.cols.list .col .rt{grid-column:2;grid-row:auto}}
.caption{margin:30px 0 0;font-size:1rem;font-style:italic;color:var(--muted);max-width:60ch}

.foot{margin-top:clamp(80px,12vw,140px);padding:26px 0 40px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;font-size:.95rem;color:var(--muted)}
.foot a{text-decoration:none}
.foot a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* okuma sayfası */
.bar{position:fixed;left:0;right:0;top:0;height:2px;background:var(--red);transform-origin:0 50%;transform:scaleX(0);z-index:5;pointer-events:none}
.read{max-width:38rem;margin:0 auto}
.mini{position:relative;margin:clamp(34px,6vw,64px) 0 0}
.mini svg{display:block;width:100%;height:64px;overflow:visible}
.mini .hit{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
.mini .hit a,.mini .hit span{display:block}
.mini .hit a:hover{background:linear-gradient(to top,var(--soft),transparent)}
.mini-l{display:flex;justify-content:space-between;margin-top:8px;font-size:.9rem;color:var(--muted)}
.mini-l a{text-decoration:none}
.mini-l a:hover{color:var(--ink)}

.rhead{padding:clamp(36px,6vw,60px) 0 30px;border-bottom:1px solid var(--rule);margin-bottom:34px}
.rhead .which{margin:0;font-size:1rem;color:var(--muted)}
.rhead .which em{color:var(--red);font-style:italic}
.rhead h1:focus{outline:none}
.rhead h1{margin:12px 0 0;font-weight:500;font-size:clamp(2.1rem,5.2vw,3.3rem);line-height:1.06;letter-spacing:-.018em;font-variation-settings:"opsz" 72;text-wrap:balance}
.rhead .deck{margin:22px 0 0;font-size:1.24rem;line-height:1.5;font-style:italic;color:var(--muted);text-wrap:pretty}
.rhead .meta{margin:20px 0 0;font-size:.95rem;color:var(--muted)}

.body{font-size:1.2rem;line-height:1.66;hanging-punctuation:first}
.body p{margin:0 0 1.05em;text-wrap:pretty}
.body > p:first-child{font-size:1.1em;line-height:1.6}
.body h2{margin:2.3em 0 .55em;font-size:1.42rem;line-height:1.2;font-weight:600;letter-spacing:-.008em;font-variation-settings:"opsz" 36}
.body h2::before{content:"";display:block;width:30px;height:2px;background:var(--red);margin-bottom:16px}

.next{margin:64px 0 0;padding:28px 0 0;border-top:1px solid var(--ink)}
.next .lbl{margin:0;font-size:1rem;color:var(--muted)}
.next a.go{display:block;text-decoration:none;margin-top:10px}
.next a.go .t{display:block;font-size:clamp(1.6rem,3.6vw,2.2rem);line-height:1.12;font-weight:500;letter-spacing:-.014em;font-variation-settings:"opsz" 60}
.next a.go:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.next a.go .a{display:block;margin-top:8px;font-style:italic;color:var(--muted);font-size:1.1rem}
.next .soon{margin:10px 0 0;font-size:1.2rem;line-height:1.55;text-wrap:pretty}
.next .soon em{color:var(--red)}
.next .back{display:inline-block;margin-top:30px;font-size:1rem;color:var(--muted);text-decoration:none}
.next .back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

@media (max-width:760px){
  .cols{grid-template-columns:1fr}
  .col{padding:20px 0 24px}
  .col + .col{padding-left:0;border-left:0;border-top:1px solid var(--rule)}
  .col .n{font-size:2.1rem}
  .top-r .home-link{display:none}
  .body{font-size:1.13rem}
}
@media (prefers-reduced-motion:reduce){
  .draw{animation:none}
  svg .p,svg .g{transition:none}
}

/* diziler: ana sayfa rafı */
.hero-home h1{font-size:clamp(2.2rem,5.4vw,4.1rem);max-width:17ch}
.crumb{margin:0 0 18px !important;font-size:1rem !important;color:var(--muted)}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.shelf{border-top:1px solid var(--ink)}
.dz{display:block;text-decoration:none;padding:30px 0 40px;border-bottom:1px solid var(--rule)}
.dz-ad{display:block;font-size:1rem;color:var(--muted)}
.dz-soru{display:block;margin-top:10px;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.08;font-weight:500;letter-spacing:-.016em;font-variation-settings:"opsz" 60;max-width:22ch;text-wrap:balance}
.dz:hover .dz-soru,.dz:focus-visible .dz-soru{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.dz-tape{display:block;margin-top:26px}
.dz-tape svg{display:block;width:100%;height:clamp(90px,13vw,150px);overflow:visible}
.dz-meta{display:block;margin-top:16px;font-size:1rem;color:var(--muted);max-width:70ch}
.dz-meta .done{color:var(--red)}
.dz:hover .p:not(.soon){stroke:var(--red)}

/* haftaya başlarken */
.pod-link{color:var(--ink);white-space:nowrap}
.pod .rhead{border-bottom:0;margin-bottom:0;padding-bottom:26px}
.pod .which a{text-decoration:none}
.pod .which a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){.top-r{gap:14px}}
.pod-link b{font-weight:500;color:var(--red)}
.pod-band{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:baseline;margin:clamp(48px,7vw,80px) 0 0;padding:24px 0 26px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);text-decoration:none}
.pod-band .k{grid-row:span 2;font-size:2.4rem;line-height:1;font-style:italic;color:var(--red);font-variation-settings:"opsz" 72}
.pod-band .t{font-size:1rem;color:var(--muted)}
.pod-band .s{font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.18;font-weight:500;letter-spacing:-.012em;font-variation-settings:"opsz" 48;text-wrap:balance}
.pod-band:hover .s,.pod-band:focus-visible .s{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.eps{border-top:1px solid var(--ink)}
.ep{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:4px 22px;align-items:baseline;padding:20px 0 24px;border-bottom:1px solid var(--rule);text-decoration:none}
.ep .n{grid-row:span 2;font-size:1.9rem;line-height:1;font-style:italic;color:var(--red);font-variation-settings:"opsz" 72}
.ep .d{font-size:.98rem;color:var(--muted)}
.ep .t{grid-column:2;font-size:1.42rem;line-height:1.2;font-weight:500;letter-spacing:-.01em;font-variation-settings:"opsz" 36;text-wrap:balance}
.ep .rt{grid-column:3;grid-row:1 / span 2;font-size:.92rem;color:var(--muted);white-space:nowrap}
.ep:hover .t,.ep:focus-visible .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
@media (max-width:760px){.ep{grid-template-columns:2.6rem 1fr}.ep .rt{grid-column:2;grid-row:auto}}
.note{margin:26px 0 0;font-size:1rem;font-style:italic;color:var(--muted);max-width:62ch}

.player{margin:0 0 40px;padding:22px 0 18px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.pl-row{display:flex;align-items:center;gap:18px}
.pl-btn{flex:none;width:58px;height:58px;border-radius:50%;border:1px solid var(--ink);background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.pl-btn:hover{background:var(--red);border-color:var(--red)}
.pl-btn svg{width:22px;height:22px;display:block}
.pl-line{position:relative;flex:1;min-width:0;height:64px;cursor:pointer;touch-action:none}
.pl-line svg{display:block;width:100%;height:100%;overflow:visible}
.pl-line .base{fill:none;stroke:var(--muted);stroke-width:1.4;opacity:.55;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pl-line .done{fill:none;stroke:var(--red);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pl-line .head{stroke:var(--red);stroke-width:1;vector-effect:non-scaling-stroke}
.pl-line .ch{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.pl-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 18px;margin-top:12px;font-size:.92rem;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.pl-meta button,.pl-meta a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.pl-meta button:hover,.pl-meta a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pl-meta .r{display:flex;gap:18px}
.chap{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.95rem}
.chap button{font:inherit;color:var(--muted);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.chap button span{font-variant-numeric:lining-nums tabular-nums;margin-right:6px}
.chap button:hover,.chap button.on{color:var(--ink)}
.chap button.on span{color:var(--red)}
.pl-wait{margin:0;font-size:1.05rem;font-style:italic;color:var(--muted)}

.box{margin:0 0 36px}
.box h2{margin:0 0 12px;font-size:1rem;font-weight:400;color:var(--muted);font-variation-settings:"opsz" 14}
.box ol,.box ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.box li{padding:12px 0;border-bottom:1px solid var(--rule);font-size:1.12rem;line-height:1.45;text-wrap:pretty}
.box ol{counter-reset:k}
.box ol li{display:grid;grid-template-columns:2rem 1fr;counter-increment:k}
.box ol li::before{content:counter(k);font-style:italic;color:var(--red)}
.box li b{font-weight:600}
.box li .w{display:block;margin-top:2px;font-size:1rem;color:var(--muted)}
.src li{font-size:1rem}
.src a{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.src a:hover{text-decoration-color:currentColor}
details.tx{margin:0 0 36px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
details.tx summary{cursor:pointer;padding:14px 0;font-size:1.12rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.tx summary::-webkit-details-marker{display:none}
details.tx summary::after{content:"Aç";color:var(--muted);font-size:.95rem}
details.tx[open] summary::after{content:"Kapat"}
details.tx .body{padding:6px 0 18px}
.small{font-size:.98rem;color:var(--muted);line-height:1.55;text-wrap:pretty}
.small + .small{margin-top:8px}
</style>
</head>

<div class="bar" id="bar" aria-hidden="true"></div>
<div class="wrap">

      <a class="home-link" href="https://mehmetcihatkeles.com" target="_blank" rel="noopener">Mehmet Cihat Keleş</a>
      <button class="theme" id="theme" type="button">Gece</button>
    </div>
  </header>
  <main id="main"></main>
  <footer class="foot">
    <span>Yazan: <a href="https://mehmetcihatkeles.com" target="_blank" rel="noopener">Mehmet Cihat Keleş</a></span>
    <span>Kardeş okul: <a href="https://okula.mehmetcihatkeles.com" target="_blank" rel="noopener">Köpeksel Bilgiler Okulası</a></span>
  </footer>
</div>

<script>
/* ==========================================================================
   DİZİLER
   Okul dizilerden oluşur. Her dizi tek bir soru etrafında kurulur ve kendi
   sayfasında, kendi fiyat çizgisiyle durur. Ana sayfada diziler burada
   yazıldıkları sırayla görünür.

   OKUL_SORUSU ve OKUL_GIRISI sitenin kimliğidir; giriş sayfasının başında
   durur. Girişin sonuna, vitrindeki dizinin adı ve "ozet" alanı eklenir.

   YENİ DİZİ: Listenin sonuna yeni bir dizi kaydı ekleyin (no, slug, ad, ozet,
   giris, durum, tohum, yazilar). "tohum" çizginin biçimini belirleyen bir
   sayıdır; her diziye farklı bir sayı verin. İsteğe bağlı "cizgiNotu",
   dizi sayfasında çizginin altındaki açıklamanın ilk yarısıdır.
   "durum": "suruyor" ya da "tamamlandi".
   "vitrin: true" olan dizi sitenin giriş sayfasıdır; yeni bir dizi başladığında
   vitrini ona taşıyın (tek bir dizide olmalı). Birden fazla dizi olduğunda
   "Tüm diziler" bağlantısı ve dizilerin listelendiği sayfa kendiliğinden belirir.

   YENİ YAZI: İlgili dizinin "yazilar" listesinde "hazir: false" olan kaydı
   bulun, metni "govde" alanına yapıştırın ve "hazir: true" yapın. Sonraki
   yazı belliyse listenin sonuna yeni bir "hazir: false" kaydı ekleyin.

   Gövde kuralları: paragraflar arasında bir boş satır; ara başlıklar "## " ile
   başlar; *yıldız arası* italik olur.

   Her yazının "cizgi" alanı, o yazının çizgideki bölümünün nasıl çizileceğini
   belirler: "merkez" (bir merkezin etrafında salınım), "yuruyus" (rastlantısal
   yürüyüş), "sicrama" (kopuk, sert sıçramalar), "trend" (dalgalı ama yönü
   belli bir gidiş), "dalga" (iç içe dalgalar), "haber" (durgun, habere
   anında basamak atlayan fiyat), "balon" (coşkuyla şişip sert sönen fiyat). Çizgi, sütunlar ve yazı
   içindeki küçük çizgi yazı sayısına göre kendiliğinden büyür.

const W = 1200, H = 260, N = 110;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const CIZGI_NOTU = {
  merkez:"bir merkezin etrafında salınıyor", yuruyus:"sarhoş gibi yürüyor", sicrama:"kopup sıçrıyor",
  trend:"dalgalanarak bir yöne akıyor", dalga:"dalgaların içinde dalgalar çiziyor", haber:"her haberi anında fiyata katıp bekliyor", balon:"coşkuyla şişip korkuyla sönüyor"
};
const LINES = {};
function lineOf(d){
  if (LINES[d.slug]) return LINES[d.slug];
  const r = rng(d.tohum || d.no*1000), ys = [], guides = [];
  const A = 2.6, slope = .045;
  let y = 0;
  d.yazilar.forEach((yz, s)=>{
    const kind = yz.cizgi || "yuruyus", base = s*N, y0 = y;
    for (let i=0;i<N;i++){
      if (kind==="merkez"){ const mu = y0 + i*slope; y = mu + A*Math.sin(i*.2) + gauss(r)*.38; if(i===0||i===N-1) guides.push({s,i:base+i,mu}); }
      else if (kind==="sicrama"){ const c = Math.tan(Math.PI*(r()-.5))*.3; y += Math.max(-4.5, Math.min(4.5, c)); }
      else if (kind==="trend"){ y += .07 + gauss(r)*.42; }
      else if (kind==="balon"){ const u=i/(N-1); const top=.78; const target = u<top ? 6.5*Math.pow(u/top,2.4) : 6.5*Math.max(0,1-(u-top)/(1-top)*1.25); y = y0 + target + gauss(r)*.22; }
      else if (kind==="haber"){ if (i % 18 === 9) y += (r() < .5 ? -1 : 1) * (1.6 + r()*1.8); else y += gauss(r)*.07; }
      else if (kind==="dalga"){ y = y0 + 1.8*Math.sin(i*.09) + .8*Math.sin(i*.37) + gauss(r)*.25; }
      else { y += gauss(r)*.5; }
      ys.push(y);
    }
  });
  const T = ys.length;
  const all = ys.concat(guides.map(g=>g.mu+A), guides.map(g=>g.mu-A));
  const lo = Math.min(...all), hi = Math.max(...all), pad = 18;
  const Y = v => (H - pad - (v-lo)/(hi-lo)*(H-2*pad)).toFixed(1);
  const X = i => (i/(T-1)*W).toFixed(1);
  const seg = (s)=>{ const a = s===0?0:s*N-1, b = (s+1)*N-1; let p=""; for(let i=a;i<=b;i++) p += (i===a?"M":"L")+X(i)+" "+Y(ys[i]); return p; };
  const gpaths = [];
  for (let k=0;k<guides.length;k+=2){
    const g0 = guides[k], g1 = guides[k+1];
    const g = off => "M"+X(g0.i)+" "+Y(g0.mu+off)+"L"+X(g1.i)+" "+Y(g1.mu+off);
    gpaths.push({s:g0.s, med:g(0), up:g(A), dn:g(-A)});
  }
  const divs = d.yazilar.slice(1).map((_,k)=>X((k+1)*N-1));
  const starts = d.yazilar.map((_,k)=> k===0 ? 0 : ((k*N-1)/(T-1)*100));
  return LINES[d.slug] = { seg, gpaths, divs, starts };
}

function tapeSVG(d, opts){
  const L = lineOf(d), hl = opts.hl || 0;
  const divs = L.divs.map(x=>`<line class="div" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`).join("");
  const guides = L.gpaths.filter(g=>opts.guides===true || opts.guides===g.s+1)
    .map(g=>`<path class="g med" d="${g.med}"/><path class="g fork" d="${g.up}"/><path class="g fork" d="${g.dn}"/>`).join("");
  const paths = d.yazilar.map((y,s)=>`<path class="p${y.hazir?"":" soon"}${hl===s+1?" on":""}" data-s="${s+1}" d="${L.seg(s)}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"${hl?' class="hl"':""}>${divs}${guides}${paths}</svg>`;
}
function highlight(svg, n){
  svg.classList.toggle("hl", !!n);
  svg.querySelectorAll(".p").forEach(p=>p.classList.toggle("on", p.dataset.s==n));
}

/* ==========================================================================
   YARDIMCILAR
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>");
const words = y => y.govde.trim().split(/\s+/).length;
const minutes = y => Math.max(1, Math.round(words(y)/220));
const SIRA = ["birinci","ikinci","üçüncü","dördüncü","beşinci","altıncı","yedinci","sekizinci","dokuzuncu","onuncu","on birinci","on ikinci"];
const sira = n => SIRA[n-1] || (n+".");
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const isRead = y => store.get("fbo-okundu-"+y.slug) === "1";
const ready = d => d.yazilar.filter(y=>y.hazir);
const VITRIN = DIZILER.find(d=>d.vitrin) || [...DIZILER].reverse().find(d=>d.durum!=="tamamlandi") || DIZILER[DIZILER.length-1];
const COK = DIZILER.length > 1;
const diziUrl = d => d === VITRIN ? "#/" : `#/dizi/${d.slug}`;
const yaziUrl = (d,y) => `#/dizi/${d.slug}/yazi/${y.slug}`;
function render(md){
  return md.trim().split(/\n\s*\n/).map(b=>{
    b = b.trim();
    if (b.startsWith("## ")) return `<h2>${inline(b.slice(3))}</h2>`;
    return `<p>${inline(b)}</p>`;
  }).join("\n");
}
function okulGirisi(d){
  const son = d.durum === "tamamlandi" ? "Son tamamlanan dizi" : "Şu an süren dizi";
  return OKUL_GIRISI + ` ${son} ${d.ad}${d.ozet ? ": " + d.ozet : ""}.`;
}
function joinTr(a){ return a.length < 2 ? (a[0]||"") : a.slice(0,-1).join(", ") + " ve " + a[a.length-1]; }

/* ==========================================================================
   SAYFALAR
   ========================================================================== */
const drawn = {};
function home(){
  document.title = "Tüm diziler | Finansal Bilgiler Okulası";
  const shelf = DIZILER.map(d=>{
    const hz = ready(d), sonraki = d.yazilar.find(y=>!y.hazir);
    const kisiler = joinTr(hz.map(y=>y.kisi)) + (sonraki ? `, sırada ${sonraki.kisi}` : "");
    const durum = d.durum === "tamamlandi"
      ? `Tamamlandı, ${hz.length} yazı`
      : `${hz.length} yazı yayında, dizi sürüyor`;
    const okunan = hz.filter(isRead).length;
    return `<a class="dz" href="${diziUrl(d)}">
      <span class="dz-ad">${d.no}. dizi</span>
      <span class="dz-soru">${esc(d.ad)}</span>
      <span class="dz-tape ${drawn.home ? "" : "draw"}">${tapeSVG(d,{guides:true})}</span>
      <span class="dz-meta">${d.ozet ? esc(d.ozet.charAt(0).toLocaleUpperCase("tr")+d.ozet.slice(1))+". " : ""}${durum}. ${esc(kisiler)}.${okunan ? ` <span class="done">Bu diziden ${okunan} yazı okudun.</span>` : ""}</span>
    </a>`;
  }).join("");
  $("#main").innerHTML = `
    <section class="hero hero-home">
      <h1>Tüm diziler</h1>
      <p>${esc(OKUL_GIRISI)}</p>
    </section>
    <nav class="shelf" aria-label="Diziler">${shelf}</nav>`;
  drawn.home = true;
}

function series(d){
  const root = d === VITRIN;
  document.title = d === VITRIN ? "Finansal Bilgiler Okulası" : d.ad + " | Finansal Bilgiler Okulası";
  const n = d.yazilar.length, list = n > 4;
  const cols = d.yazilar.map(y=>{
    const inner = `<span class="n">${y.no}</span>
      <span class="who">${esc(y.kisi)}</span>
      <span class="ans">${esc(y.cevap)}</span>
      ${y.hazir ? `<span class="ttl">${esc(y.baslik)}</span>` : ""}
      <span class="rt">${y.hazir ? (isRead(y) ? `<span class="done">Okundu</span>, ${minutes(y)} dakikalık okuma` : `${minutes(y)} dakikalık okuma`) : "Hazırlanıyor"}</span>`;
    return y.hazir
      ? `<a class="col" href="${yaziUrl(d,y)}" data-n="${y.no}">${inner}</a>`
      : `<div class="col soon" data-n="${y.no}">${inner}</div>`;
  }).join("");
  const L = lineOf(d);
  const first = !drawn[d.slug];
  $("#main").innerHTML = `
    <section class="hero">
      ${COK && !root ? `<p class="crumb"><a href="#/diziler">Tüm diziler</a> <span aria-hidden="true">/</span> ${d.no}. dizi: ${esc(d.ad)}</p>` : ""}
      <h1>${esc(root ? OKUL_SORUSU : d.ad)}</h1>
      <p>${esc(root ? okulGirisi(d) : d.giris)}</p>
    </section>
    <figure class="tape" style="margin-left:0;margin-right:0">
      <div class="${first ? "draw" : ""}" id="tapebox">${tapeSVG(d,{guides:true})}</div>
      <div class="nums" aria-hidden="true">${L.starts.map((p,k)=>`<span style="left:${p.toFixed(2)}%">${k+1}</span>`).join("")}</div>
    </figure>
    <nav class="cols${list ? " list" : ""}" style="--n:${n}" aria-label="Dizinin yazıları">${cols}</nav>
    <p class="caption">Yukarıdaki çizgi dizinin kendisi. ${d.cizgiNotu ? esc(d.cizgiNotu) : "Her bölümü, dizinin bir yazısı"}: ${d.yazilar.map((y,k)=>(k===0?"önce ":"sonra ")+(CIZGI_NOTU[y.cizgi]||CIZGI_NOTU.yuruyus)).join(", ")}.</p>
    ${root ? podBand() : ""}`;
  drawn[d.slug] = true;
  const svg = $("#tapebox svg");
  document.querySelectorAll(".col").forEach(c=>{
    const on = ()=>highlight(svg, c.dataset.n), off = ()=>highlight(svg, 0);
    c.addEventListener("mouseenter", on); c.addEventListener("mouseleave", off);
    c.addEventListener("focus", on); c.addEventListener("blur", off);
  });
}

function article(d, y){
  document.title = y.baslik + " | Finansal Bilgiler Okulası";
  const next = d.yazilar.find(z=>z.no===y.no+1);
  const hits = d.yazilar.map(z=> z.hazir && z.no!==y.no
    ? `<a href="${yaziUrl(d,z)}" aria-label="${z.no}. yazı: ${esc(z.baslik)}"></a>` : `<span></span>`).join("");
  let end;
  if (next && next.hazir){
    end = `<p class="lbl">Dizide sıradaki, ${sira(next.no)} yazı</p>
      <a class="go" href="${yaziUrl(d,next)}"><span class="t">${esc(next.baslik)}</span><span class="a">${esc(next.kisi)}: ${esc(next.cevap)}</span></a>`;
  } else if (next){
    end = `<p class="lbl">Dizide sıradaki, ${sira(next.no)} yazı</p>
      <p class="soon"><em>${esc(next.kisi)}</em> hazırlanıyor. ${esc(next.spot)}</p>`;
  } else if (d.durum === "tamamlandi"){
    end = `<p class="lbl">${esc(d.ad)} dizisinin son yazısı</p>
      <a class="go" href="#/diziler"><span class="t">Diğer dizilere göz at</span></a>`;
  } else {
    end = `<p class="lbl">Dizinin şimdilik son yazısı</p>`;
  }
  $("#main").innerHTML = `
    <article class="read">
      <div class="mini">
        ${tapeSVG(d,{hl:y.no, guides:y.no})}
        <div class="hit" style="--n:${d.yazilar.length}">${hits}</div>
      </div>
      <div class="mini-l"><a href="${diziUrl(d)}">${esc(d.ad)}</a><span>${y.no} / ${d.yazilar.length}</span></div>
      <header class="rhead">
        <p class="which">${esc(d.ad)} dizisinin ${sira(y.no)} yazısı, <em>${esc(y.kisi)}</em></p>
        <h1 tabindex="-1">${esc(y.baslik)}</h1>
        <p class="deck">${inline(y.spot)}</p>
        <p class="meta">${minutes(y)} dakikalık okuma</p>
      </header>
      <div class="body">${render(y.govde)}</div>
      <footer class="next">${end}<br><a class="back" href="${diziUrl(d)}">Dizinin başına dön</a></footer>
    </article>`;
  const h = $(".rhead h1"); if (h) h.focus({preventScroll:true});
}


/* ==========================================================================
   HAFTAYA BAŞLARKEN SAYFALARI
   ========================================================================== */
const podUrl = b => `#/${PODCAST.slug}/${b.slug}`;
const sureYaz = s => s ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "";
const dakika = s => s ? `${Math.round(s/60)} dakika` : "";
let audio = null;
function podBand(){
  const b = PODCAST.bolumler[0]; if (!b) return "";
  return `<a class="pod-band" href="${podUrl(b)}">
    <span class="k">${b.no}</span>
    <span class="t">Yeni program: ${esc(PODCAST.ad)}, her Pazartesi. ${b.no}. bölüm, ${esc(b.tarih)}${b.sure ? ", " + dakika(b.sure) : ""}</span>
    <span class="s">${esc(b.baslik)}</span>
  </a>`;
}
function podList(){
  document.title = PODCAST.ad + " | Finansal Bilgiler Okulası";
  const eps = PODCAST.bolumler.map(b=>`<a class="ep" href="${podUrl(b)}">
      <span class="n">${b.no}</span><span class="d">${esc(b.tarih)}</span>
      <span class="t">${esc(b.baslik)}</span>
      <span class="rt">${b.sure ? dakika(b.sure) + " dinleme" : ""}</span></a>`).join("");
  $("#main").innerHTML = `
    <section class="hero hero-home">
      <h1>${esc(PODCAST.ad)}</h1>
      <p>${esc(PODCAST.giris)}</p>
    </section>
    <nav class="eps" aria-label="Bölümler">${eps}</nav>
    <p class="note">Bu program yatırım tavsiyesi değildir; bir okuma ve öğrenme çalışmasıdır. Beril'in sesi yapay zekâyla üretilmiştir.</p>`;
}
function podLine(seed, n){
  const r = rng(seed), ys = []; let y = 0;
  for (let i=0;i<n;i++){ y += gauss(r)*.5 + (i%23===11 ? (r()<.5?-1:1)*1.4 : 0); ys.push(y); }
  const lo = Math.min(...ys), hi = Math.max(...ys);
  return ys.map((v,i)=>(i?"L":"M")+(i/(n-1)*1000).toFixed(1)+" "+(70-(v-lo)/(hi-lo||1)*60).toFixed(1)).join("");
}
function podEpisode(b){
  document.title = b.baslik.replace(/\.$/,"") + " | " + PODCAST.ad;
  const d = podLine(4200 + b.no*17, 260);
  const kis = b.kisimlar.map(k=>`<li><button type="button" data-t="${k[0]}"><span>${sureYaz(k[0]) || "0:00"}</span>${esc(k[1])}</button></li>`).join("");
  const chLines = b.sure ? b.kisimlar.slice(1).map(k=>{ const x=(k[0]/b.sure*1000).toFixed(1); return `<line class="ch" x1="${x}" y1="0" x2="${x}" y2="80"/>`; }).join("") : "";
  $("#main").innerHTML = `
    <article class="read pod">
      <header class="rhead">
        <p class="which"><a href="#/${PODCAST.slug}">${esc(PODCAST.ad)}</a>, <em>${b.no}. bölüm</em>, ${esc(b.tarih)}</p>
        <h1 tabindex="-1">${esc(b.baslik)}</h1>
        <p class="deck">${inline(b.spot)}</p>
      </header>
      <section class="player" aria-label="Bölümü dinle">
        <div class="pl-row">
          <button class="pl-btn" type="button" id="pl-btn" aria-label="Dinle"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pl-ico" d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
          <div class="pl-line" id="pl-line" role="slider" tabindex="0" aria-label="Bölümde ilerle" aria-valuemin="0" aria-valuemax="${Math.round(b.sure)||0}" aria-valuenow="0">
            <svg viewBox="0 0 1000 80" preserveAspectRatio="none" aria-hidden="true">
              <defs><clipPath id="pl-clip"><rect id="pl-rect" x="0" y="-10" width="0" height="100"/></clipPath></defs>
              ${chLines}
              <path class="base" d="${d}"/>
              <path class="done" d="${d}" clip-path="url(#pl-clip)"/>
              <line class="head" id="pl-head" x1="0" y1="0" x2="0" y2="80"/>
            </svg>
          </div>
        </div>
        <div class="pl-meta"><span id="pl-time">0:00 / ${sureYaz(b.sure) || "–"}</span>
          <span class="r"><button type="button" id="pl-geri">15 sn geri</button><button type="button" id="pl-hiz">Hız 1×</button><a href="${b.ses}" download>İndir</a></span></div>
        ${kis ? `<ol class="chap">${kis}</ol>` : ""}
        <audio id="pl-audio" preload="metadata" src="${b.ses}"></audio>
      </section>
      <section class="box"><h2>Başlıklar</h2><ol>${b.basliklar.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol></section>
      <section class="box"><h2>Bu haftanın kırılgan noktaları</h2><ol>${b.kirilgan.map(x=>`<li><span><b>${esc(x[0])}</b><span class="w">${esc(x[1])}</span></span></li>`).join("")}</ol></section>
      <details class="tx"><summary>Bölümün metni</summary><div class="body">${render(b.metin)}</div></details>
      <section class="box src"><h2>Kaynaklar</h2><ul>${b.kaynaklar.map(x=>`<li><a href="${x[1]}" target="_blank" rel="noopener">${esc(x[0])}</a></li>`).join("")}</ul></section>
      <p class="small">${esc(b.verilerTarihi)} Bu program yatırım tavsiyesi değildir; bir okuma ve öğrenme çalışmasıdır.</p>
      <p class="small">Sunan: Beril. Beril'in sesi yapay zekâyla üretilmiştir (ElevenLabs). Hazırlayan: Mehmet Cihat Keleş.</p>
      <footer class="next"><a class="back" href="#/${PODCAST.slug}">Tüm bölümler</a></footer>
    </article>`;
  playerKur(b);
  const h = $(".rhead h1"); if (h) h.focus({preventScroll:true});
}
function playerKur(b){
  const a = audio = $("#pl-audio"), btn = $("#pl-btn"), ico = $("#pl-ico"), line = $("#pl-line");
  const rect = $("#pl-rect"), head = $("#pl-head"), time = $("#pl-time"), hizB = $("#pl-hiz");
  const HIZ = [1, 1.25, 1.5, .9]; let hi = 0;
  const dur = () => (isFinite(a.duration) && a.duration) || b.sure || 0;
  const paint = () => {
    const D = dur(), p = D ? a.currentTime / D : 0, x = (p*1000).toFixed(1);
    rect.setAttribute("width", x); head.setAttribute("x1", x); head.setAttribute("x2", x);
    time.textContent = `${sureYaz(a.currentTime) || "0:00"} / ${sureYaz(D) || "–"}`;
    line.setAttribute("aria-valuenow", Math.round(a.currentTime)); line.setAttribute("aria-valuetext", sureYaz(a.currentTime) || "0:00");
    document.querySelectorAll(".chap button").forEach((c,i,all)=>{
      const t0 = +c.dataset.t, t1 = all[i+1] ? +all[i+1].dataset.t : Infinity;
      c.classList.toggle("on", a.currentTime >= t0 && a.currentTime < t1 && a.currentTime > 0);
    });
  };
  const icon = () => { const on = !a.paused; ico.setAttribute("d", on ? "M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" : "M7 4.5v15l13-7.5z"); btn.setAttribute("aria-label", on ? "Duraklat" : "Dinle"); };
  btn.onclick = () => a.paused ? a.play() : a.pause();
  a.addEventListener("play", icon); a.addEventListener("pause", icon); a.addEventListener("ended", icon);
  a.addEventListener("timeupdate", paint); a.addEventListener("loadedmetadata", paint);
  const seek = e => { const r = line.getBoundingClientRect(); const p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); if (dur()) { a.currentTime = p*dur(); paint(); } };
  let drag = false;
  line.addEventListener("pointerdown", e=>{ drag = true; line.setPointerCapture(e.pointerId); seek(e); });
  line.addEventListener("pointermove", e=>{ if (drag) seek(e); });
  line.addEventListener("pointerup", ()=>{ drag = false; });
  line.addEventListener("keydown", e=>{
    if (e.key==="ArrowRight"){ a.currentTime = Math.min(dur(), a.currentTime+10); e.preventDefault(); }
    if (e.key==="ArrowLeft"){ a.currentTime = Math.max(0, a.currentTime-10); e.preventDefault(); }
    if (e.key===" "){ btn.click(); e.preventDefault(); }
  });
  $("#pl-geri").onclick = () => { a.currentTime = Math.max(0, a.currentTime - 15); };
  hizB.onclick = () => { hi = (hi+1) % HIZ.length; a.playbackRate = HIZ[hi]; hizB.textContent = `Hız ${String(HIZ[hi]).replace(".",",")}×`; };
  document.querySelectorAll(".chap button").forEach(c=> c.onclick = () => { a.currentTime = +c.dataset.t; if (a.paused) a.play(); });
  paint();
}

let current = null;
function route(){
  const h = location.hash;
  let m;
  current = null;
  if (audio){ audio.pause(); audio = null; }
  if ((m = h.match(/^#\/haftaya-baslarken(?:\/([\w-]+))?/))){
    const b = m[1] && PODCAST.bolumler.find(z=>z.slug===m[1]);
    if (b) podEpisode(b); else podList();
    window.scrollTo(0,0); progress(); return;
  }
  if ((m = h.match(/^#\/yazi\/([\w-]+)/))){           // eski bağlantılar
    for (const d of DIZILER){ const y = d.yazilar.find(z=>z.slug===m[1] && z.hazir); if (y){ location.replace(yaziUrl(d,y)); return; } }
  }
  if ((m = h.match(/^#\/dizi\/([\w-]+)(?:\/yazi\/([\w-]+))?/))){
    const d = DIZILER.find(z=>z.slug===m[1]);
    if (d && m[2]){
      const y = d.yazilar.find(z=>z.slug===m[2] && z.hazir);
      if (y){ current = y; article(d,y); window.scrollTo(0,0); progress(); return; }
    }
    if (d){ series(d); window.scrollTo(0,0); progress(); return; }
  }
  if (h.startsWith("#/diziler") && COK){ home(); window.scrollTo(0,0); progress(); return; }
  series(VITRIN); window.scrollTo(0,0); progress();
}

function progress(){
  const bar = $("#bar");
  if (!current){ bar.style.transform = "scaleX(0)"; return; }
  const body = $(".body"); if (!body) return;
  const top = body.getBoundingClientRect().top + scrollY - innerHeight*.3;
  const end = body.getBoundingClientRect().bottom + scrollY - innerHeight;
  const p = Math.max(0, Math.min(1, (scrollY - top) / Math.max(1, end - top)));
  bar.style.transform = `scaleX(${p})`;
  if (p > .92) store.set("fbo-okundu-"+current.slug, "1");
}
addEventListener("scroll", progress, {passive:true});
addEventListener("resize", progress);
addEventListener("hashchange", route);

/* gece/gündüz */
(function(){
  const root = document.documentElement, btn = $("#theme");
  const saved = store.get("fbo-tema"); if (saved) root.dataset.theme = saved;
  const dark = ()=> root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const label = ()=>{ btn.textContent = dark() ? "Gündüz" : "Gece"; };
  btn.addEventListener("click", ()=>{ root.dataset.theme = dark() ? "light" : "dark"; store.set("fbo-tema", root.dataset.theme); label(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", label);
  label();
})();

if (COK) $("#all-link").hidden = false;
route();
</script>
